apply plugin: 'com.android.application'
apply from: './mob.gradle'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-kapt'

static def releaseTime() {
    return new Date().format("yyyyMMdd", TimeZone.getTimeZone("UTC"))
}

android {
    namespace 'com.jiechengsheng.city'
    compileSdkVersion 33
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.jiechengsheng.city"
        minSdkVersion 23
        targetSdkVersion 31
        versionCode 63
        versionName "0.3.21"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        flavorDimensions "versionCode"

        ndk {
            abiFilters 'armeabi', 'armeabi-v7a', 'arm64-v8a'
        }

        manifestPlaceholders = [
                JPUSH_PKGNAME: applicationId,
                JPUSH_APPKEY : "c1845048016655585610609e",
                JPUSH_CHANNEL: "default_developer"
        ]

        packagingOptions {
            doNotStrip '*/mips/*.so'
            doNotStrip '*/mips64/*.so'
        }
    }

    signingConfigs {
        debug { storeFile file("../keystore/debug.keystore") }
        release {
            storeFile file('../keystore/where.jks')
            storePassword "jcs12345678"
            keyAlias "key0"
            keyPassword "jcs12345678"
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        release {
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "Where_v${defaultConfig.versionCode}_(${defaultConfig.versionName})_${releaseTime()}.apk"
        }
    }

    productFlavors {
        dev {
            buildConfigField "String", "SERVER_HOST", SERVER_HOST_TEST
            buildConfigField "String", "RONG_CLOUD_APP_KEY", RONG_CLOUD_APP_KEY_DEVELOP
            buildConfigField "String", "GOOGLE_CLOUD_API_KEY", GOOGLE_CLOUD_API_KEY
            buildConfigField "String", "GOOGLE_CLOUD_OAUTH_CLIENT_ID", GOOGLE_CLOUD_OAUTH_CLIENT_ID
            buildConfigField "String", "UMENG_APP_KEY", UMENG_APP_KEY
            buildConfigField "String", "UMENG_APP_CHANNEL", UMENG_APP_CHANNEL_DEV
            buildConfigField "String", "UMENG_APP_CHANNEL_DEV", UMENG_APP_CHANNEL_DEV
            buildConfigField "String", "UMENG_APP_CHANNEL_FORMAL", UMENG_APP_CHANNEL_FORMAL
        }

        formal {
            buildConfigField "String", "SERVER_HOST", SERVER_HOST_RELEASE
            buildConfigField "String", "RONG_CLOUD_APP_KEY", RONG_CLOUD_APP_KEY_RELEASE
            buildConfigField "String", "GOOGLE_CLOUD_API_KEY", GOOGLE_CLOUD_API_KEY
            buildConfigField "String", "GOOGLE_CLOUD_OAUTH_CLIENT_ID", GOOGLE_CLOUD_OAUTH_CLIENT_ID
            buildConfigField "String", "UMENG_APP_KEY", UMENG_APP_KEY
            buildConfigField "String", "UMENG_APP_CHANNEL", UMENG_APP_CHANNEL_FORMAL
            buildConfigField "String", "UMENG_APP_CHANNEL_DEV", UMENG_APP_CHANNEL_DEV
            buildConfigField "String", "UMENG_APP_CHANNEL_FORMAL", UMENG_APP_CHANNEL_FORMAL
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.4'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.blankj:utilcodex:1.31.1'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.9.0'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.6'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.10.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation 'com.google.android.material:material:1.6.1'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.12'
    implementation 'com.github.bumptech.glide:glide:4.13.2'
    kapt 'com.github.bumptech.glide:compiler:4.13.2'
    implementation 'in.srain.cube:ptr-load-more:1.0.6'
    implementation 'com.gongwen:marqueelibrary:1.1.3'
    implementation 'com.makeramen:roundedimageview:2.3.0'
    implementation 'com.squareup.picasso:picasso:2.5.2'

    implementation 'com.belerweb:pinyin4j:2.5.0'
    implementation 'de.hdodenhof:circleimageview:2.1.0'
    implementation 'com.github.promeg:tinypinyin:2.0.3'
    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    implementation 'com.google.maps.android:android-maps-utils:3.4.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'org.greenrobot:eventbus:3.2.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.nostra13.universalimageloader:universal-image-loader:1.9.4'
    implementation 'com.facebook.rebound:rebound:0.3.8'
    implementation 'com.just.agentweb:agentweb:4.1.3'
    implementation 'com.lcodecorex:tkrefreshlayout:1.0.7'
    implementation 'com.sothree.slidinguppanel:library:3.4.0'
    implementation 'com.github.xiaohaibin:XBanner:androidx_v1.1.2'
    implementation 'com.github.Jay-Goo:RangeSeekBar:3.0.0'
    implementation 'com.haibin:calendarview:3.7.0'

    implementation 'com.jaeger.statusbaruitl:library:1.3.2'
    implementation 'net.yslibrary.keyboardvisibilityevent:keyboardvisibilityevent:2.0.0'

    implementation 'cn.jzvd:jiaozivideoplayer:7.6.0'

    def room_version = "2.4.3"
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    implementation 'cn.jiguang.sdk:jpush-google:4.8.5'
    implementation 'cn.jiguang.sdk:jcore-google:4.0.0'

    implementation files('libs/visitor-client-v1.0.aar')

    implementation 'com.zhihu.android:matisse:0.5.3-beta3'

    implementation 'com.tbruyelle.rxpermissions2:rxpermissions:0.9.5'

    implementation 'cn.rongcloud.sdk:im_kit:5.2.4'

    implementation 'io.github.h07000223:flycoTabLayout:3.0.0'

    implementation 'com.github.CarGuo.GSYVideoPlayer:gsyVideoPlayer-java:v8.1.4-jitpack'
