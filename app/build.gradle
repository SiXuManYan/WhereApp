    implementation 'com.github.CarGuo.GSYVideoPlayer:gsyVideoPlayer-armv7a:v8.1.4-jitpack'

    implementation 'io.github.youth5201314:banner:2.2.2'

    implementation 'com.github.MZCretin:ExpandableTextView:v1.6.1-x'

    implementation 'androidx.navigation:navigation-fragment-ktx:2.4.1'
    implementation 'androidx.navigation:navigation-ui-ktx:2.4.1'

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    implementation 'androidx.core:core-ktx:1.8.0'

    implementation 'com.scwang.smart:refresh-layout-kernel:2.0.3'

    implementation 'com.google.maps.android:maps-ktx:2.3.0'
    implementation 'com.google.maps.android:maps-utils-ktx:2.3.0'
    implementation "biz.laenger.android:vpbs:0.0.6"

    implementation 'com.oushangfeng:PinnedSectionItemDecoration:1.3.2-androidx'

    implementation 'top.zibin:Luban:1.1.8'

    implementation 'com.facebook.android:facebook-applinks:[4,5)'

    implementation 'com.github.chrisbanes:PhotoView:2.0.0'

    implementation 'me.shaohui:bottomdialog:1.1.9'

    implementation 'com.google.zxing:core:3.5.1'
}
